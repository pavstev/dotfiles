"$schema" = 'https://starship.rs/config-schema.json'

# Powerline prompt — Claude colour palette over the official Gruvbox Rainbow
# preset structure (https://starship.rs/presets/gruvbox-rainbow). Warm stone
# background, copper accent, cream text. Two intentional tweaks vs. the preset:
# username is hidden unless relevant, and the last segment shows command
# duration instead of a clock.

add_newline = true
command_timeout = 1000

format = """
[](color_copper)\
$os\
$username\
[](bg:color_amber fg:color_copper)\
$directory\
[](fg:color_amber bg:color_sage)\
$git_branch\
$git_status\
[](fg:color_sage bg:color_steel)\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:color_steel bg:color_bg3)\
$docker_context\
$conda\
$pixi\
[](fg:color_bg3 bg:color_bg1)\
$cmd_duration\
[ ](fg:color_bg1)\
$line_break$character"""

palette = "claude"

[palettes.claude]
color_fg0    = "#EDE8E3"   # cream  — text on coloured segments
color_bg1    = "#292524"   # stone  — duration segment background
color_bg3    = "#57514C"   # stone  — docker/conda segment background
color_copper = "#E0825F"   # copper — os / username (the signature accent)
color_amber  = "#DBA85C"   # amber  — directory
color_sage   = "#87B083"   # sage   — git
color_steel  = "#7FA6CC"   # steel  — language / runtime versions
color_teal   = "#5FB3B0"   # teal
color_mauve  = "#C089AD"   # mauve  — vim replace mode
color_red    = "#D97066"   # red    — error

[os]
disabled = false
style = "bg:color_copper fg:color_bg1"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = false
style_user = "bg:color_copper fg:color_bg1"
style_root = "bg:color_copper fg:color_bg1"
format = '[ $user ]($style)'

[directory]
style = "fg:color_bg1 bg:color_amber"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
read_only = " "

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:color_sage"
format = '[[ $symbol $branch ](fg:color_bg1 bg:color_sage)]($style)'

[git_status]
style = "bg:color_sage"
format = '[[($all_status$ahead_behind )](fg:color_bg1 bg:color_sage)]($style)'

[nodejs]
symbol = ""
style = "bg:color_steel"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_steel)]($style)'

[bun]
symbol = ""
style = "bg:color_steel"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_steel)]($style)'

[c]
symbol = " "
style = "bg:color_steel"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_steel)]($style)'

[cpp]
symbol = " "
style = "bg:color_steel"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_steel)]($style)'

[rust]
symbol = ""
style = "bg:color_steel"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_steel)]($style)'

[golang]
symbol = ""
style = "bg:color_steel"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_steel)]($style)'

[php]
symbol = ""
style = "bg:color_steel"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_steel)]($style)'

[java]
symbol = ""
style = "bg:color_steel"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_steel)]($style)'

[kotlin]
symbol = ""
style = "bg:color_steel"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_steel)]($style)'

[haskell]
symbol = ""
style = "bg:color_steel"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_steel)]($style)'

[python]
symbol = ""
style = "bg:color_steel"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_steel)]($style)'

[docker_context]
symbol = ""
style = "bg:color_bg3"
format = '[[ $symbol( $context) ](fg:color_fg0 bg:color_bg3)]($style)'

[conda]
style = "bg:color_bg3"
format = '[[ $symbol( $environment) ](fg:color_fg0 bg:color_bg3)]($style)'

[pixi]
style = "bg:color_bg3"
format = '[[ $symbol( $version)( $environment) ](fg:color_fg0 bg:color_bg3)]($style)'

[cmd_duration]
min_time = 500
style = "bg:color_bg1"
format = '[[  $duration ](fg:color_fg0 bg:color_bg1)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = "[❯](bold fg:color_copper)"
error_symbol   = "[❯](bold fg:color_red)"
vimcmd_symbol  = "[❮](bold fg:color_copper)"
vimcmd_replace_one_symbol = "[❮](bold fg:color_mauve)"
vimcmd_replace_symbol     = "[❮](bold fg:color_mauve)"
vimcmd_visual_symbol      = "[❮](bold fg:color_amber)"
