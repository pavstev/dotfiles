<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
  <title id="t">dotfiles: one command sets up a machine for AI coding agents</title>
  <style>
    .aurora { transform-origin: 64px 64px; animation: drift 14s ease-in-out infinite alternate; }
    .a2 { animation-duration: 18s; animation-direction: alternate-reverse; }
    .cursor { animation: blink 1.2s steps(1, end) infinite; }
    .glyph { transform-origin: 64px 64px; animation: pop 4.8s cubic-bezier(.34,1.56,.64,1) infinite; }
    @keyframes drift { from { transform: rotate(0deg) scale(1); } to { transform: rotate(40deg) scale(1.12); } }
    @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: .15; } }
    @keyframes pop { 0%, 80%, 100% { transform: scale(1); } 86% { transform: scale(1.06); } 92% { transform: scale(.98); } }
    @media (prefers-reduced-motion: reduce) { .aurora, .cursor, .glyph { animation: none; } }
  </style>
  <defs>
    <linearGradient id="night" x1="64" y1="0" x2="64" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#151827"/><stop offset="1" stop-color="#07080F"/>
    </linearGradient>
    <radialGradient id="violet" cx="34" cy="30" r="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A97CFF" stop-opacity=".55"/><stop offset="1" stop-color="#A97CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="teal" cx="104" cy="98" r="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4FE0C8" stop-opacity=".38"/><stop offset="1" stop-color="#4FE0C8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rose" cx="104" cy="22" r="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF6FB5" stop-opacity=".3"/><stop offset="1" stop-color="#FF6FB5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="30" y1="36" x2="70" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A97CFF"/><stop offset=".5" stop-color="#5E8BFF"/><stop offset="1" stop-color="#4FE0C8"/>
    </linearGradient>
    <linearGradient id="gold" x1="74" y1="78" x2="98" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC46B"/><stop offset="1" stop-color="#FF6FB5"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A97CFF"/><stop offset=".35" stop-color="#5E8BFF"/><stop offset=".65" stop-color="#4FE0C8"/><stop offset="1" stop-color="#FFC46B"/>
    </linearGradient>
    <linearGradient id="sheen" x1="64" y1="0" x2="64" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".09"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tile"><rect width="128" height="128" rx="30"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="128" height="128" fill="url(#night)"/>
    <!-- the night sky of the site: slow drifting light -->
    <g class="aurora"><rect x="-32" y="-32" width="192" height="192" fill="url(#violet)"/><rect x="-32" y="-32" width="192" height="192" fill="url(#rose)"/></g>
    <g class="aurora a2"><rect x="-32" y="-32" width="192" height="192" fill="url(#teal)"/></g>
    <!-- a few stars -->
    <g fill="#E8EAF2">
      <circle cx="98" cy="40" r=".9" opacity=".7"/><circle cx="22" cy="96" r=".7" opacity=".5"/>
      <circle cx="84" cy="18" r=".6" opacity=".6"/><circle cx="110" cy="70" r=".7" opacity=".45"/>
    </g>
    <rect width="128" height="70" fill="url(#sheen)"/>
  </g>

  <!-- hairline rim with a sky gradient, like the avatar ring on the site -->
  <rect x="1.25" y="1.25" width="125.5" height="125.5" rx="28.75" stroke="url(#rim)" stroke-opacity=".55" stroke-width="2.5"/>

  <!-- the prompt: a chevron, a dot and a cursor -->
  <g class="glyph">
    <path d="M33 42 L55 64 L33 86" stroke="url(#sky)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="66" cy="83" r="5.5" fill="#E8EAF2"/>
    <rect class="cursor" x="77" y="78" width="21" height="10" rx="4" fill="url(#gold)"/>
  </g>
</svg>
