[package]
name = "agent-config"
version = "0.1.0"
edition = "2024"
rust-version = "1.89" # File::lock (the guard's state file)

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
dirs = "6"
sha2 = "0.10"
tempfile = "3"
walkdir = "2"
regex = "1"
tantivy = { version = "0.27", default-features = false, features = ["mmap", "lz4-compression", "stopwords", "stemmer"] }

# The prompt backend. crossterm pulls winapi 0.3, whose GNU import libraries clash with the
# raw-dylib ones of windows-sys: on windows-gnu the linked exe crashes before main. So Windows
# uses the console backend.
[target.'cfg(not(windows))'.dependencies]
inquire = { version = "0.9.4", default-features = false, features = ["crossterm", "editor"] }

[target.'cfg(windows)'.dependencies]
inquire = { version = "0.9.4", default-features = false, features = ["console", "editor"] }

[dev-dependencies]
serde = "1" # one test pretty-prints with a custom indent

# Strip only: a fifth smaller at no build cost. Fat LTO was a third smaller but made each rebuild
# after a pull about 4 times slower, with the same start-up time (BENCHMARK.md). Keep the default
# panic = "unwind": guard and guard_cursor fail open through catch_unwind.
[profile.release]
strip = "symbols"

[[bin]]
name = "agent-config"
path = "src/main.rs"

[[bin]]
name = "guard_cursor"
path = "src/bin/guard_cursor.rs"

[[bin]]
name = "guard"
path = "src/bin/guard.rs"

[[bin]]
name = "spawn"
path = "src/bin/spawn.rs"

[[bin]]
name = "route"
path = "src/bin/route.rs"

[[bin]]
name = "harness_stats"
path = "src/bin/harness_stats.rs"

[[bin]]
name = "whatsleft_scan"
path = "src/bin/whatsleft_scan.rs"

[[bin]]
name = "hurry_scan"
path = "src/bin/hurry_scan.rs"

[[bin]]
name = "yt_transcribe"
path = "src/bin/yt_transcribe.rs"

[[bin]]
name = "dots"
path = "src/bin/dots.rs"

[[bin]]
name = "pace"
path = "src/bin/pace.rs"

[[bin]]
name = "tools"
path = "src/bin/tools.rs"

[[bin]]
name = "statusline"
path = "src/bin/statusline.rs"

[[bin]]
name = "skill_check"
path = "src/bin/skill_check.rs"

[[bin]]
name = "mic_check"
path = "src/bin/mic_check.rs"

[[bin]]
name = "bag_check"
path = "src/bin/bag_check.rs"

[[bench]]
name = "hooks"
harness = false

[[bin]]
name = "ctx"
path = "src/bin/ctx.rs"

[[bin]]
name = "sessions"
path = "src/bin/sessions.rs"
