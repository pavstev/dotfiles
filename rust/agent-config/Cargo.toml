[package]
name = "agent-config"
version = "0.1.0"
edition = "2024"
rust-version = "1.89" # let chains need 1.88; scripts/setup-lib.sh checks this number

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json ={ version = "1", features = ["preserve_order", "float_roundtrip"] }
dirs = "6"
sha2 = "0.10"
tempfile = "3"
walkdir = "2"
thiserror = "2"

# The prompt backend. crossterm pulls winapi 0.3, whose GNU import libraries clash with the
# raw-dylib ones of windows-sys: on windows-gnu the linked exe crashes before main. So Windows
# uses the console backend.
[dev-dependencies]
serde = "1" # tests/agent_config.rs serializes with a custom formatter

[target.'cfg(not(windows))'.dependencies]
inquire = { version = "0.9.4", default-features = false, features = ["crossterm", "editor"] }

[target.'cfg(windows)'.dependencies]
inquire = { version = "0.9.4", default-features = false, features = ["console", "editor"] }

[lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
redundant_clone = "warn"
use_self = "warn"
# Restriction lints, picked one by one as Clippy advises for that group. Tests may unwrap
# (clippy.toml), and each test crate allows it.
allow_attributes_without_reason = "warn"
unwrap_used = "warn"
# Pedantic lints that do not fit a crate of small command-line tools:
must_use_candidate = "allow" # most fns run for their effect or feed a print at once
too_many_lines = "allow" # each check and install step reads top to bottom
cast_precision_loss = "allow" # f64 holds sizes and percents, far below 2^52
similar_names = "allow" # paired short names read well in the parsers and tests
many_single_char_names = "allow" # short names in the parsers and the test fixtures
struct_excessive_bools = "allow" # flag structs of the command lines

# Strip only: a fifth smaller at no build cost. Fat LTO was a third smaller but made each rebuild
# after a pull about 4 times slower, with the same start-up time. Keep the default
# panic = "unwind": `run_args` turns a panic of an in-process agent-config run into a failure.
[profile.release]
strip = "symbols"

[[bin]]
name = "agent-config"
path = "src/main.rs"

[[bin]]
name = "dots"
path = "src/bin/dots.rs"

[[bin]]
name = "tools"
path = "src/bin/tools.rs"

[[bin]]
name = "port"
path = "src/bin/port.rs"
